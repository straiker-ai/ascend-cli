# Kubernetes Job — one Job per assessment, in the cluster the agent under test runs in.
#
#   kubectl create secret generic ascend-relay \
#       --from-literal=bridge-key='tc-...' \
#       --from-literal=pat='s6r_pat_...' \
#       --from-file=target-config=./target.json
#   kubectl apply -f k8s-job.yaml
#   kubectl logs -f job/ascend-relay
#
# A Job, not a Deployment. A Deployment's job is to keep a pod running; this workload is supposed
# to END, and a Deployment would restart the relay forever after its assessment finished — which
# is the "billing the customer forever" failure this directory exists to remove.
apiVersion: batch/v1
kind: Job
metadata:
  name: ascend-relay
  labels:
    app.kubernetes.io/name: ascend-relay
spec:
  # The container exits non-zero whenever the relay stopped while its assessment was still live.
  # backoffLimit is therefore how many times the cluster will put the relay back in front of a
  # run that is still going — after a node drain, an eviction, a network blip. 6 is the
  # Kubernetes default and is a reasonable number of resurrections for a run measured in hours.
  backoffLimit: 6
  # Backstop only. The relay stops itself when its assessment reaches a terminal state; this
  # bounds the case where the run never reaches one (PLATFORM-ASKS B0).
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ascend-relay
    spec:
      # OnFailure, not Never: the pod is restarted in place, which is the fastest way back to
      # leasing. The entrypoint deletes any heartbeat left by the previous attempt precisely so
      # a restart in the same filesystem cannot read a stale status file and call the new attempt
      # a success.
      restartPolicy: OnFailure
      # An in-flight lease long-poll is not interruptible; a clean stop can take up to about
      # (wait_ms + 10)s, which is ~35s at the default 25000. Less than that and SIGKILL lands
      # mid-probe, and a probe leased but never answered waits out the platform's ~90s reclaim.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: REPLACE_REGISTRY/ascend-relay:1.1.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              # Measured while serving ~3 probes/s against a local target: 1.4-2.4% of one core
              # and ~60 MiB resident, flat over the run. The request is deliberately small; the
              # limit is headroom for an adapter that parses large responses.
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            # Per-run values. Both change every assessment, so in practice this file is templated
            # or patched (`kubectl create job --from=cronjob` / kustomize / helm) rather than
            # edited by hand.
            - name: ASCEND_RELAY_APP_ID
              value: REPLACE_aapp_id
            - name: ASCEND_ASSESSMENT_ID
              value: REPLACE_assessment_id
            # The container's OWN ceiling, and the one that binds: lower than
            # activeDeadlineSeconds above, and unlike that one it produces a verdict.
            # activeDeadlineSeconds expiring marks the Job DeadlineExceeded and deletes the pods,
            # which tells nobody WHY nothing ever finished; the entrypoint hitting this exits 1
            # with a line naming the stop condition. Raise BOTH for a scope that genuinely runs
            # longer than six hours. See README §4.1.
            - name: ASCEND_RELAY_DEADLINE_S
              value: "21600"
            # Three live credentials, all from the Secret, none in the image:
            #   bridge-key     leases probes for ONE Ascend application
            #   pat            reads this tenant's assessments — this is what lets the container
            #                  know its run has finished, and it is the only reason a PAT is here
            #   target-config  the adapter config, which carries whatever the agent under test
            #                  authenticates with when that is not itself an env: reference
            - name: STRAIKER_BRIDGE_API_KEY
              valueFrom:
                secretKeyRef: { name: ascend-relay, key: bridge-key }
            - name: STRAIKER_PAT
              valueFrom:
                secretKeyRef: { name: ascend-relay, key: pat }
            - name: ASCEND_RELAY_CONFIG_JSON
              valueFrom:
                secretKeyRef: { name: ascend-relay, key: target-config }
          volumeMounts:
            # The only two paths the relay writes. With readOnlyRootFilesystem they must be
            # mounted or the relay cannot publish the heartbeat that the container reads to
            # decide whether the run finished — and a missing heartbeat is reported as a failure,
            # so forgetting these turns every healthy run red rather than hiding a broken one.
            - { name: state, mountPath: /var/lib/ascend/state }
            - { name: work, mountPath: /var/lib/ascend/work }
      volumes:
        - name: state
          emptyDir: {}
        - name: work
          emptyDir: { medium: Memory }
